<!doctype html>
<html lang="en">
<head>

<body>

    <div id="content" class="popup-content" tabindex="-1"></div>
    <footer class="popup-footer"><span id="footer-status"><span class="dot"></span>Sample data · 10:42</span><button id="advance" aria-label="Advance simulated agent activity">Advance demo <span aria-hidden="true">↗</span></button></footer>
