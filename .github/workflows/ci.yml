name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Toolchain
        run: |
          xcode-select -p
          swift --version
          python3 --version
      - name: Approved manifest checks
        run: python3 scripts/ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: Relay-v0.1.0-preview.1-${{ github.sha }}-macos-arm64
          path: |
            build/preview/Relay-v0.1.0-preview.1-macos-arm64.zip
            build/preview/Relay-v0.1.0-preview.1-macos-arm64.zip.sha256
          if-no-files-found: error
