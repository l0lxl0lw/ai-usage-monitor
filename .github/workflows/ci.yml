name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Toolchain
        run: |
          xcode-select -p
          swift --version
          python3 --version
      - name: Approved manifest checks
        run: python3 scripts/ci.py
